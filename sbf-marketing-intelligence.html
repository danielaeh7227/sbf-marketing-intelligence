// ---- src/lib/constellation.js
// Constellation: faint dots behind the home screen, linked to their near neighbours.
// With a sphere to follow, the dots gather in orbits around it, turn with it, and every so often
// one reaches in and links to a member dot on the sphere's near face, then lets go.

const TAU = Math.PI * 2;
const MAX_TETHERS = 7;

class Constellation {
  // sphere(): null, or { x, y, r, dx, dy, dots: [{ px, py, front }] }; dot positions are offset by dx, dy into this canvas
  constructor(canvas, { density = 9000, link = 170, sphere = null } = {}) {
    this.cv = canvas; this.cx = canvas.getContext('2d'); this.density = density; this.link = link; this.sphere = sphere;
    this.nodes = []; this.tethers = []; this.nextTether = 0;
    this.frame = this.frame.bind(this); this.resize = this.resize.bind(this);
    this.ro = new ResizeObserver(this.resize); this.ro.observe(canvas);
    this.resize();
    this.raf = requestAnimationFrame(this.frame);
  }

  resize() {
    const r = this.cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    this.w = r.width; this.h = r.height; this.cv.width = r.width * d; this.cv.height = r.height * d;
    this.cx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.max(40, Math.min(150, Math.round(this.w * this.h / this.density)));
    while (this.nodes.length < n) this.nodes.push(this.spawn());
    this.nodes.length = n;
    if (REDUCED) this.frame(0);
  }

  // Each dot has an orbit: a distance from the sphere's rim (most sit close) and an angle that turns slowly
  spawn() {
    const q = Math.random();
    return { x: Math.random() * this.w, y: Math.random() * this.h, orbit: Math.pow(q, 2.4), ang: Math.random() * TAU, tilt: .55 + Math.random() * .4,
      wob: Math.random() * TAU, vx: (Math.random() - .5) * .16, vy: (Math.random() - .5) * .16,
      r: 1 + Math.random() * 1.8 * (1 - q * .5), ph: Math.random() * TAU, sp: .12 + Math.random() * .3 };
  }

  frame(now) {
    if (this.dead) return;
    const { cx, w, h, nodes, link } = this, t = now / 1000, L2 = link * link;
    const S = this.sphere ? this.sphere() : null;
    cx.clearRect(0, 0, w, h);

    for (const p of nodes) {
      if (S) {
        // orbit the sphere: inner orbits turn faster, like the sphere's own spin; the ring is flattened so it reads as 3D
        const far = Math.max(w, h) * .6, rad = S.r * 1.08 + p.orbit * (far - S.r);
        if (!REDUCED) p.ang += (.0009 + .0016 * (1 - p.orbit)) ;
        const tx = S.x + Math.cos(p.ang) * rad, ty = S.y + Math.sin(p.ang) * rad * p.tilt + Math.sin(t * .4 + p.wob) * 6;
        // ease toward the orbit, so a resize or the sign-in morph never snaps
        p.x += (tx - p.x) * .04; p.y += (ty - p.y) * .04;
      } else {
        if (!REDUCED) { p.x += p.vx; p.y += p.vy; }
        if (p.x < -20) p.x = w + 20; else if (p.x > w + 20) p.x = -20;
        if (p.y < -20) p.y = h + 20; else if (p.y > h + 20) p.y = -20;
      }
      p.a = REDUCED ? .55 : Math.pow(Math.min(1, Math.max(0, Math.sin(t * p.sp + p.ph) * .8 + .35)), 1.4) * .9; // each dot fades out for a spell, so the field keeps changing
      if (S) { const d = Math.hypot(p.x - S.x, p.y - S.y); if (d < S.r * 1.04) p.a *= .2; } // never sit on top of the sphere
    }

    cx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i]; if (a.a < .02) continue;
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j]; if (b.a < .02) continue;
        const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 > L2) continue;
        cx.strokeStyle = `rgba(0,176,216,${Math.min(a.a, b.a) * (1 - Math.sqrt(d2) / link) * .6})`;
        cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
      }
    }

    if (S && S.dots.length && !REDUCED) this.tether(S, t);

    for (const p of nodes) {
      if (p.a < .02) continue;
      cx.fillStyle = `rgba(120,214,240,${p.a})`; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill();
    }
    if (!REDUCED) this.raf = requestAnimationFrame(this.frame);
  }

  // Intermittent links into the sphere: a visible dot near the rim reaches the nearest front-facing member dot on its side
  tether(S, t) {
    const { cx } = this;
    if (t > this.nextTether && this.tethers.length < MAX_TETHERS) {
      this.nextTether = t + .35 + Math.random() * .9;
      const near = this.nodes.filter(p => p.a > .35 && !this.tethers.some(x => x.node === p) && Math.hypot(p.x - S.x, p.y - S.y) < S.r * 1.7);
      const node = near[Math.floor(Math.random() * near.length)];
      if (node) {
        const ux = node.x - S.x, uy = node.y - S.y, ul = Math.hypot(ux, uy) || 1;
        let best = -1, score = -1;
        for (let i = 0; i < S.dots.length; i++) {
          const d = S.dots[i]; if (d.front < .55) continue;
          const vx = d.px + S.dx - S.x, vy = d.py + S.dy - S.y, vl = Math.hypot(vx, vy) || 1;
          const sc = (ux * vx + uy * vy) / (ul * vl) * .8 + d.front * .5 + Math.random() * .5; // on the node's side, on the near face
          if (sc > score) { score = sc; best = i; }
        }
        if (best >= 0) this.tethers.push({ node, dot: best, born: t, life: 2.2 + Math.random() * 1.6 });
      }
    }
    this.tethers = this.tethers.filter(x => t - x.born < x.life);
    for (const x of this.tethers) {
      const p = S.dots[x.dot]; if (!p) continue;
      const d = { px: p.px + S.dx, py: p.py + S.dy, front: p.front };
      const q = (t - x.born) / x.life, env = Math.sin(Math.PI * q) * Math.min(1, d.front * 1.6 - .5); // fades in, holds, fades out; lets go as the dot turns away
      if (env <= .01) continue;
      const g = cx.createLinearGradient(x.node.x, x.node.y, d.px, d.py);
      g.addColorStop(0, `rgba(120,214,240,${.6 * env})`); g.addColorStop(1, `rgba(140,226,248,${.95 * env})`);
      cx.strokeStyle = g; cx.lineWidth = 1.3; cx.beginPath(); cx.moveTo(x.node.x, x.node.y); cx.lineTo(d.px, d.py); cx.stroke();
      // a pulse travels from the dot into the sphere
      const k = Math.min(1, q * 1.8), px = x.node.x + (d.px - x.node.x) * k, py = x.node.y + (d.py - x.node.y) * k;
      cx.fillStyle = `rgba(190,240,255,${env})`; cx.beginPath(); cx.arc(px, py, 1.8, 0, TAU); cx.fill();
      cx.strokeStyle = `rgba(160,232,250,${.8 * env})`; cx.lineWidth = 1.2; cx.beginPath(); cx.arc(d.px, d.py, 5 + 4 * q, 0, TAU); cx.stroke();
      cx.fillStyle = `rgba(120,214,240,${.25 * env})`; cx.beginPath(); cx.arc(x.node.x, x.node.y, 5, 0, TAU); cx.fill(); // the reaching dot glows
    }
    cx.lineWidth = 1;
  }

  destroy() { this.dead = true; cancelAnimationFrame(this.raf); this.ro.disconnect(); }
}

// Background: linked dots that orbit the sphere and now and then link into its member dots
function Sky({ field }) {
  const ref = useRef();
  useEffect(() => {
    const sphere = () => {
      const f = field.current, S = f?.sphere; if (!S) return null;
      const a = f.cv.getBoundingClientRect(), b = ref.current.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      return { x: S.x + dx, y: S.y + dy, r: S.r, dx, dy, dots: f.pts };
    };
    const c = new Constellation(ref.current, { sphere }); return () => c.destroy();
  }, []);
  return html`<canvas class="sky" ref=${ref} aria-hidden="true"></canvas>`;
}

// Keyboard-first ask box. Suggestions appear once you start typing; Tab takes the faded completion.
function AskSera({ s }) {
  const [q, setQ] = useState(''), [sel, setSel] = useState(-1), [open, setOpen] = useState(false);
  const input = useRef();
  const all = useMemo(() => [...new Set([...SERA[s.user.role].prompts, ...ASK_MORE])], [s.user.role]);
  const typed = q.trim().toLowerCase(), words = typed.split(/\s+/).filter(w => w.length > 1);
  const matches = typed ? all.map(p => { const l = p.toLowerCase(); return [p, (l.startsWith(typed) ? 10 : 0) + words.filter(w => l.includes(w)).length]; })
    .filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([p]) => p) : [];
  const list = matches.length ? matches : all.slice(0, 3);
  const ghost = typed && matches[0]?.toLowerCase().startsWith(q.toLowerCase()) ? matches[0].slice(q.length) : '';

  useEffect(() => {
    if (!EMBED && matchMedia('(pointer: fine)').matches) input.current?.focus({ preventScroll: true });
    const key = e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) { e.preventDefault(); input.current?.focus(); } };
    addEventListener('keydown', key); return () => removeEventListener('keydown', key);
  }, []);

  const ask = text => { if (!text.trim()) return; actions.open('sera', { ask: text.trim() }); setQ(''); setSel(-1); setOpen(false); };
  const onKey = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); setOpen(true); setSel(i => e.key === 'ArrowDown' ? (i + 1 < list.length ? i + 1 : -1) : (i > -1 ? i - 1 : list.length - 1)); } // -1 is the typed text
    else if (e.key === 'Tab' && ghost) { e.preventDefault(); setQ(q + ghost); }
    else if (e.key === 'Escape') { setOpen(false); setSel(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); ask(sel >= 0 && sel < list.length ? list[sel] : q); }
  };
  const showSugg = open && typed;

  return html`<form class="ask" onSubmit=${e => e.preventDefault()}>
    <div class="ask-sugg" role="listbox" id="ask-sugg" hidden=${!showSugg}>
      <small>${matches.length ? 'Suggestions' : 'Try asking'}</small>
      ${list.map((p, i) => html`<button type="button" role="option" aria-selected=${i === sel} class=${i === sel ? 'on' : ''} onMouseDown=${e => e.preventDefault()} onClick=${() => ask(p)}>
        <${Icon} name="spark"/><span>${p}</span></button>`)}
    </div>
    <div class="ask-box">
      <span class="sera-av sm"><span class="sera-dot"></span></span>
      <div class="ask-field">
        <span class="ask-ghost" aria-hidden="true"><span>${q}</span>${ghost}</span>
        <input ref=${input} value=${q} placeholder="Ask Sera" aria-label="Ask Sera" autocomplete="off"
          role="combobox" aria-expanded=${!!showSugg} aria-controls="ask-sugg"
          onInput=${e => { setQ(e.target.value); setSel(-1); setOpen(true); }} onKeyDown=${onKey} onBlur=${() => document.hasFocus() && setOpen(false)} onFocus=${() => setOpen(true)}/>
      </div>
      <kbd class="ask-kbd" hidden=${!q}>${ghost ? 'Tab' : 'Enter'}</kbd>
      <button type="button" class="icon-btn" aria-label="Attach a file" onClick=${() => actions.open('sera', { attach: true })}><${Icon} name="clip"/></button>
      <button type="button" class="ask-mic" aria-label="Speak to Sera" onClick=${() => actions.open('sera', { listen: true })}><${Icon} name="mic"/></button>
    </div>
  </form>`;
}

const MONTHS = ['2026-09', '2026-10', '2026-11', '2026-12'];

const stageLabel = st => STAGES.find(x => x[0] === st)[1];

function Plan({ s, route }) {
  const [month, setMonth] = useState('2026-11'), [view, setView] = useState('month');
  // deep link #/plan/<id>: open after App has closed the previous page's overlays (parent effects run after this one)
  useEffect(() => { if (route.id) { const e = s.entries.find(x => x.id === route.id); if (e) { setMonth(e.date.slice(0, 7)); setTimeout(() => actions.open('entry', { id: e.id })); } } }, [route.id]);
  const entries = s.entries;
  const inMonth = entries.filter(e => e.date.startsWith(month)).sort((a, b) => a.date.localeCompare(b.date));

  // month grid, Monday first
  const first = new Date(month + '-01T00:00:00Z'), lead = (first.getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  const cells = Array.from({ length: Math.ceil((lead + days) / 7) * 7 }, (_, i) => { const d = i - lead + 1; return d >= 1 && d <= days ? month + '-' + String(d).padStart(2, '0') : null; });
  const mi = MONTHS.indexOf(month);

  return html`<div class="plan">
    <div class="toolbar">
      <div class="month-nav">
        <button class="icon-btn ring" aria-label="Previous month" disabled=${mi <= 0} onClick=${() => setMonth(MONTHS[mi - 1])}><${Icon} name="chevL"/></button>
        <h1>${monthName(month)}</h1>
        <button class="icon-btn ring" aria-label="Next month" disabled=${mi >= MONTHS.length - 1} onClick=${() => setMonth(MONTHS[mi + 1])}><${Icon} name="chevR"/></button>
      </div>
      <div class="seg"><button class=${view === 'month' ? 'on' : ''} onClick=${() => setView('month')}>Month</button><button class=${view === 'list' ? 'on' : ''} onClick=${() => setView('list')}>List</button></div>
      <span class="grow"></span>
      <button class="btn btn-o" onClick=${() => actions.open('bulk')}><${Icon} name="upload"/>Bulk Import</button>
      <button class="btn btn-p" onClick=${() => actions.open('new')}><${Icon} name="plus"/>New Entry</button>
    </div>

    ${s.warnings.map(w => html`<div class=${'warn-bar ' + w.tone} key=${w.id}><${Icon} name="alert"/><span class="grow"><b>Sera:</b> ${w.text}</span>
      <${Button} variant="g" size="sm" onClick=${() => actions.applyFix(w.id)}>${w.fix}<//></div>`)}

    <div class="type-legend">${Object.entries(TYPES).map(([k, [l]]) => html`<span><i class=${'type-dot ' + k}></i>${l}</span>`)}<span class="muted">· Dots Show the Sign-Off Stage</span></div>

    ${view === 'month' ? html`<div class="cal card">
      ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => html`<div class="cal-h">${d}</div>`)}
      ${cells.map(d => html`<div class=${'cal-d ' + (d ? '' : 'off ') + (d === TODAY ? 'today' : '')}>
        ${d && html`<span class="dn">${+d.slice(8)}</span>`}
        ${d && entries.filter(e => e.date === d).map(e => html`<button class=${'cal-e ' + e.type + (e.fresh ? ' fresh' : '')} onClick=${() => actions.open('entry', { id: e.id })} title=${e.title + ' · ' + stageLabel(e.stage)}>
          <i class=${'st ' + e.stage}></i>${e.title}</button>`)}
      </div>`)}
    </div>` : html`<div class="card table-card"><table class="tbl">
      <thead><tr><th>Date</th><th>Entry</th><th>Type</th><th>Audience</th><th>Channels</th><th>Stage</th></tr></thead>
      <tbody>${inMonth.length === 0 ? html`<tr><td colspan="6" class="muted">Nothing planned this month.</td></tr>` : inMonth.map(e => html`<tr onClick=${() => actions.open('entry', { id: e.id })}>
        <td data-l="Date">${fmtDate(e.date)}</td><td><b>${e.title}</b><small>Requested by ${e.owner}</small></td><td data-l="Type"><i class=${'type-dot ' + e.type}></i>${TYPES[e.type][0]}</td>
        <td data-l="Audience">${e.audience.count ? e.audience.count.toLocaleString('en-SG') : 'Public'}</td>
        <td class="ch-icons" data-l="Channels">${e.channels.length ? e.channels.map(c => html`<span title=${chName(c)}><${Icon} name=${CHANNELS[c].icon}/></span>`) : html`<span class="muted">Not chosen</span>`}</td>
        <td data-l="Stage"><span class=${'stage-chip ' + e.stage}>${stageLabel(e.stage)}</span></td></tr>`)}</tbody></table></div>`}
  </div>`;
}

        : html`<p class="muted">Scheduled. Sends go out on the dates above.</p>`}

const AUDIENCES = [['All members', 34160], ['Ordinary members', 33424], ['Associate members', 736], ['Active members', 1100], ['Steady members', 1500], ['Members needing attention', 154],
  ['New members (last 30 days)', 86], ['Trade and logistics members', 1240], ['Manufacturing members', 980], ['Financial and professional services', 1460], ['SG-WEN members', 310], ['YBLN members', 420], ['PW Mark holders', 412]];

// Groups overlap, so the reach is an estimate: "All members" covers everything, otherwise the largest group plus 80% of the rest
function reach(groups, people) {
  const n = groups.map(g => AUDIENCES.find(a => a[0] === g)[1]).sort((a, b) => b - a);
  const total = groups.includes('All members') ? 34160 : n.length ? Math.min(34160, Math.round(n[0] + n.slice(1).reduce((x, y) => x + y, 0) * .8)) : 0;
  return total + (groups.includes('All members') ? 0 : people.length);
}

function AudiencePicker({ s, groups, people, onChange, err }) {
  const [q, setQ] = useState('');
  const ql = q.trim().toLowerCase();
  const hits = ql.length < 2 ? [] : s.members.filter(m => !people.includes(m.id) && (m.name + ' ' + m.contact[0] + ' ' + m.sector).toLowerCase().includes(ql)).slice(0, 6);
  const tog = g => onChange(groups.includes(g) ? groups.filter(x => x !== g) : [...groups, g], people);
  const total = reach(groups, people);
  return html`<div class="field full aud-pick"><span>Custom Audience <small class="aud-sum">${total ? '≈ ' + total.toLocaleString('en-SG') + ' members' : 'Pick groups or members'}</small></span>
    <div class="aud-groups" role="group" aria-label="Member groups">${AUDIENCES.map(([l, n]) => html`<button type="button" class=${'aud-g ' + (groups.includes(l) ? 'on' : '')} aria-pressed=${groups.includes(l)} onClick=${() => tog(l)}>${l}<small>${n.toLocaleString('en-SG')}</small></button>`)}</div>
    <div class="aud-search"><${Icon} name="search"/><input value=${q} onInput=${x => setQ(x.target.value)} placeholder="Add specific members: company, contact or sector" aria-label="Search members"/>
      ${hits.length > 0 && html`<div class="aud-hits">${hits.map(m => html`<button type="button" onClick=${() => { onChange(groups, [...people, m.id]); setQ(''); }}><span class=${'av av-sm ' + m.band}>${m.ab}</span><span class="grow"><b>${m.name.replace(/ Pte Ltd$/, '')}</b><small>${m.contact[0]} · ${m.sector}</small></span><${Icon} name="plus"/></button>`)}</div>`}</div>
    ${people.length > 0 && html`<div class="aud-people">${people.map(id => { const m = s.members.find(x => x.id === id); return html`<span class="aud-chip">${m.name.replace(/ Pte Ltd$/, '')}<button type="button" aria-label=${'Remove ' + m.name} onClick=${() => onChange(groups, people.filter(x => x !== id))}><${Icon} name="x"/></button></span>`; })}</div>`}
    ${err ? html`<small class="err">${err}</small>` : html`<small>Membership confirms the final audience at sign-off. Consent rules apply to every member.</small>`}
  </div>`;
}

function NewEntry({ s }) {
  const [f, setF] = useState({ title: '', type: 'mice', date: '2026-12-02', time: '9:00 am', venue: '', rsvpBy: '', eligibility: 'All members', groups: ['All members'], people: [], goal: '' });
  const [err, setErr] = useState({});
  const set = k => e => setF({ ...f, [k]: e.target.value });
  async function save() {
    const er = {}; if (!f.title.trim()) er.title = 'Give the entry a name.'; if (!f.date) er.date = 'Pick a date.'; if (!f.groups.length && !f.people.length) er.aud = 'Pick at least one group or member.';
    setErr(er); if (Object.keys(er).length) return Promise.reject();
    const segments = [...f.groups.map(g => [g, AUDIENCES.find(a => a[0] === g)[1]]), ...(f.people.length ? [['Specific members', f.people.length]] : [])];
    const label = segments.length === 1 ? segments[0][0] : 'Custom: ' + segments.map(x => x[0]).join(', ');
    const [made] = await actions.addEntries([{ title: f.title.trim(), type: f.type, dept: 'Membership Department', owner: 'Membership', date: f.date, time: f.time, venue: f.venue, rsvpBy: f.type === 'mice' ? (f.rsvpBy || shift(f.date, -7)) : null,
      eligibility: f.eligibility, goal: f.goal || 'Not set', audience: { label, count: reach(f.groups, f.people), segments, people: f.people } }], s.user.name);
    navigate('create/' + made.id);
  }
  return html`<${Modal} wide title="New Calendar Entry" footer=${html`<button class="btn btn-g" onClick=${actions.close}>Cancel</button><${Button} onClick=${save}>Add and Get Channel Ideas<//>`}>
    <div class="form">
      <label class="field full"><span>Name</span><input value=${f.title} onInput=${set('title')} placeholder="e.g. Go Global: Malaysia Market Briefing" aria-invalid=${!!err.title}/>${err.title && html`<small class="err">${err.title}</small>`}</label>
      <label class="field"><span>Type</span><select value=${f.type} onChange=${set('type')}>${Object.entries(TYPES).map(([k, [l, d]]) => html`<option value=${k}>${l} · ${d}</option>`)}</select></label>
      <div class="field"><span>Requested By</span><div class="ro-val">Membership Department</div></div>
      <label class="field"><span>Date</span><input type="date" value=${f.date} onInput=${set('date')} aria-invalid=${!!err.date}/></label>
      <label class="field"><span>Time</span><input value=${f.time} onInput=${set('time')}/></label>
      ${f.type === 'mice' && html`<label class="field"><span>Venue</span><input value=${f.venue} onInput=${set('venue')} placeholder="SBF Centre"/></label>
        <label class="field"><span>RSVP By</span><input type="date" value=${f.rsvpBy} onInput=${set('rsvpBy')}/><small>Default: a week before</small></label>`}
      <label class="field"><span>Open To</span><select value=${f.eligibility} onChange=${set('eligibility')}>${['All members', 'Associate members', 'A network only (e.g. SG-WEN, YBLN)', 'Invite only', 'Public'].map(o => html`<option value=${o}>${o}</option>`)}</select></label>
      <label class="field"><span>Goal</span><input value=${f.goal} onInput=${set('goal')} placeholder="e.g. 120 confirmed seats"/></label>
      <${AudiencePicker} s=${s} groups=${f.groups} people=${f.people} err=${err.aud} onChange=${(groups, people) => setF({ ...f, groups, people })}/>
    </div><//>`;
}

const SAMPLE_CSV = `title,type,date,audience
Go Global: Malaysia Market Briefing,mice,2026-12-03,Trade and logistics members
YBLN Year-End Mixer,mice,2026-12-10,YBLN members
Membership Renewal Reminder,promo,2026-12-01,Members needing attention
BizSpoke · January Issue,news,,All members`;

function BulkImport({ s }) {
  const [text, setText] = useState(SAMPLE_CSV);
  const rows = text.trim().split(/\r?\n/).slice(1).filter(Boolean).map(line => {
    const [title, type, date, aud] = line.split(',').map(x => (x || '').trim());
    const problems = [!title && 'no name', !TYPES[type] && 'unknown type', !/^\d{4}-\d{2}-\d{2}$/.test(date || '') && 'no date'].filter(Boolean);

  const [f, setF] = useState({ who: '', tier: 'member', slot, week, units: 1 });
  const sl = slotOf(f.slot), weeks = sl.unit === 'month' ? 4 * f.units : f.units;
  const clash = Array.from({ length: weeks }, (_, i) => f.week + i).some(w => w >= AD_WEEKS.length || holder(s.adBookings, f.slot, w));
  const p = adPrice(f.slot, f.units, f.tier), ok = f.who.trim() && !clash;
  const set = k => e => setF({ ...f, [k]: k === 'week' || k === 'units' ? +e.target.value : e.target.value });
  return html`<${Modal} title="New Booking" footer=${html`<button class="btn btn-g" onClick=${actions.close}>Cancel</button>
      <${Button} disabled=${!ok} onClick=${async () => { await actions.adBook({ who: f.who.trim(), tier: f.tier, slot: f.slot, week: f.week, weeks, units: f.units, value: p.total }); }}>Book it<//>`}>
    <div class="form">
      <label class="field full"><span>Advertiser</span><input value=${f.who} onInput=${set('who')} placeholder="Company name"/></label>
      <div class="field full"><span>Membership</span><div class="seg full">${AD_TIERS.map(([k, l, d]) => html`<button type="button" class=${f.tier === k ? 'on' : ''} onClick=${() => setF({ ...f, tier: k })}>${l}${d ? html` <small>${d * 100}% off</small>` : ''}</button>`)}</div></div>
      <label class="field"><span>Placement</span><select value=${f.slot} onChange=${set('slot')}>${AD_SLOTS.map(x => html`<option value=${x.id}>${x.name}</option>`)}</select></label>
      <label class="field"><span>Starts</span><select value=${f.week} onChange=${set('week')}>${AD_WEEKS.map((w, i) => html`<option value=${i}>Week of ${w}</option>`)}</select></label>
      <label class="field"><span>How many ${sl.unit}s</span><select value=${f.units} onChange=${set('units')}>${[1, 2, 3, 4].map(n => html`<option value=${n}>${n}</option>`)}</select></label>
      <div class="field"><span>Runs</span><p class="adv-runs">${weeks} week${weeks > 1 ? 's' : ''}</p></div>
    </div>
    ${clash && html`<div class="lock"><${Icon} name="alert"/>That placement is already taken in those weeks. Choose another start week.</div>`}
    <div class="adv-total"><div class="kv"><span>${adMoney(sl.rate)} × ${f.units} ${sl.unit}${f.units > 1 ? 's' : ''}</span><b>${adMoney(p.list)}</b></div>
      ${p.off > 0 && html`<div class="kv"><span>${tierName(f.tier)} discount</span><b class="pos">−${adMoney(p.off)}</b></div>`}
      <div class="kv adv-sum"><span>Total</span><b>${adMoney(p.total)}</b></div></div>
    <p class="note"><${Icon} name="shield"/>The ad is labelled "Partner". The advertiser sees results for this ad only.</p>
  <//>`;
}

// ---- src/App.js

const PAGE = { overview: Overview, know: Know, plan: Plan, create: Create, approve: Approve, learn: Learn, ads: Ads, settings: Settings };

function App() {
  const s = useStore(), route = useRoute();
  useEffect(() => { actions.close(); scrollTo(0, 0); }, [route.page]);
  useEffect(() => { if (s.user && !location.hash) navigate('overview'); }, [s.user]);
  useEffect(() => { // deck frames can open a panel: open=band:lo, open=sera (with ask=...), open=bulk
    const o = EMBED?.get('open'); if (!o) return;
    const [kind, band] = o.split(':'), t = setTimeout(() => actions.open(kind, kind === 'band' ? { band } : kind === 'sera' ? { ask: EMBED.get('ask') || undefined } : {}), 600);
    return () => clearTimeout(t);
  }, []);
  if (!s.user) return html`<${Login}/><${Toasts} toasts=${s.toasts}/>`;
  const Page = PAGE[route.page], o = s.overlay;
  return html`
    <${Shell} s=${s} route=${route}><${Page} s=${s} route=${route}/><//>
    ${o?.kind === 'sera' && html`<${Drawer} label="Sera"><${Sera} s=${s} ...${o}/><//>`}
    ${o?.kind === 'band' && html`<${Drawer} label="Members" modal=${false}><${BandPanel} s=${s} key=${o.band} band=${o.band} id=${o.id}/><//>`}
    ${o?.kind === 'entry' && html`<${Drawer} label="Calendar entry"><${EntryDrawer} s=${s} id=${o.id}/><//>`}
    ${o?.kind === 'notifs' && html`<${Drawer} label="Notifications"><${Notifs}/><//>`}
    ${o?.kind === 'new' && html`<${NewEntry} s=${s}/>`}
    ${o?.kind === 'bulk' && html`<${BulkImport} s=${s}/>`}
    ${o?.kind === 'book' && html`<${NewBooking} s=${s} ...${o}/>`}
    ${o?.kind === 'account' && html`<${Modal} title="Account" footer=${html`<button class="btn btn-o" onClick=${() => { actions.signOut(); }}><${Icon} name="logout"/>Sign out</button>`}>
      <p><b>${s.user.name}</b><br/><span class="muted">${s.user.dept}</span></p>
      <p class="muted">Signing out takes you back to the account picker, where you can try the other role.</p><//>`}
    ${o?.kind === 'about' && html`<${Modal} title="About This Prototype">
      <p>SBF Marketing Intelligence: one workflow for Membership and Marketing & Communications.</p>
      <ul class="about"><li><b>Know</b>: a single view of every member from the CRM, events, email, web and public sources.</li>
        <li><b>Plan</b>: the shared calendar of MICE and promotional entries, one at a time or in bulk.</li>
        <li><b>Create</b>: Sera suggests channels and drafts the copy and visuals for each member group.</li>
        <li><b>Approve</b>: the Membership Department signs off the audience, then the Marketing & Communications Department signs off tone, visuals and channel.</li>
        <li><b>Learn</b>: activity scores, campaign results and a post-mortem with next actions.</li>
        <li><b>Ads</b>: the Marketing & Communications Department books, places and tracks partner ads, a second income line beside membership dues.</li></ul>
      <p class="muted">All companies, people, scores and results are sample data. Sign in as Cheryl Kong to see the Membership Department view and as Carolina Ng for the Marketing & Communications Department view.</p><//>`}
    <${Toasts} toasts=${s.toasts}/>`;
}

// ---- src/main.js

render(html`<${App}/>`, document.getElementById('app'));

</script>
</body>
</html>
